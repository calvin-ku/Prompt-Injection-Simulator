name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite
        run: pytest -q

      - name: Run campaign smoke test
        run: |
          python run_campaign.py \
            --target local \
            --firewall-mode monitor \
            --target-mode vulnerable \
            --attack ATTACK-AGC-UNAUTH-01 \
            --variants-per-attack 1 \
            --include-benign \
            --output /tmp/events.jsonl

          test "$(wc -l < /tmp/events.jsonl)" -eq 25

  docker:
    name: Docker Build and Smoke Test
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -f infra/Dockerfile \
            -t prompt-injection-simulator:ci \
            .

      - name: Verify container CLI
        run: |
          docker run --rm \
            prompt-injection-simulator:ci \
            --help

      - name: Run container campaign
        run: |
          mkdir -p ci-output

          docker run --rm \
            -v "$PWD/ci-output:/app/output" \
            prompt-injection-simulator:ci \
            --target local \
            --firewall-mode monitor \
            --target-mode vulnerable \
            --attack ATTACK-AGC-UNAUTH-01 \
            --variants-per-attack 1 \
            --include-benign \
            --output /app/output/events.jsonl

          test "$(wc -l < ci-output/events.jsonl)" -eq 25